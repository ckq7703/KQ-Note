name: Build and Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # No google-auth* / OAuth client secret here: the desktop client only
          # opens the browser + catches the loopback code; the backend does the
          # code->token exchange. Nothing secret is bundled into the release.
          pip install nuitka zstandard ordered-set pillow pywin32 requests pynput
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }

      - name: Pre-process XOR Obfuscation
        run: |
          python xor_obfuscate.py

      - name: Build executable with Nuitka
        run: |
          python -m nuitka `
            --standalone `
            --assume-yes-for-downloads `
            --enable-plugin=tk-inter `
            --windows-console-mode=disable `
            --windows-icon-from-ico=assets/logo-kqnote.ico `
            --include-data-dir=assets=assets `
            --company-name="KQ Note" `
            --product-name="KQ Note" `
            --file-version=1.5.0.0 `
            --product-version=1.5.0.0 `
            --file-description="KQ Note - Desktop Cheatsheet Note App" `
            --copyright="Copyright (c) 2026 ckq7703" `
            --output-dir=dist `
            --output-filename=KQNote.exe `
            main.py
          if (Test-Path "dist\KQNote") { Remove-Item -Recurse -Force "dist\KQNote" }
          if (Test-Path "dist\main.dist") { Move-Item -Path "dist\main.dist" -Destination "dist\KQNote" -Force }

      - name: Compile Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Create Portable Zip
        run: |
          Compress-Archive -Path "dist\KQNote\*" -DestinationPath "installer_output\KQNote-Portable.zip" -Force

      - name: Extract Tag or Version Name
        id: version
        shell: powershell
        run: |
          $ver = "${{ github.ref_name }}"
          if ($ver -notlike "v*") { $ver = "v1.5.0" }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "TAG=$ver"

      - name: Rename Artifacts with Version
        shell: powershell
        run: |
          $ver = "${{ steps.version.outputs.TAG }}"
          Move-Item -Path "installer_output\KQNoteSetup.exe" -Destination "installer_output\KQNoteSetup-$ver.exe" -Force
          Move-Item -Path "installer_output\KQNote-Portable.zip" -Destination "installer_output\KQNote-$ver-Portable.zip" -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.version.outputs.TAG }}
          tag_name: ${{ steps.version.outputs.TAG }}
          draft: false
          prerelease: false
          files: |
            installer_output/KQNoteSetup-*.exe
            installer_output/KQNote-*-Portable.zip
          body: |
            ## 🚀 KQ Note ${{ steps.version.outputs.TAG }}

            ### ✨ Tính năng mới & Cải tiến:
            - **Đồng bộ nhiều ghi chú giữa các thiết bị:** mỗi ghi chú được đồng bộ riêng (nội dung, thứ tự, thùng rác). Làm việc ngoại tuyến thoải mái, thay đổi tự gửi lên khi có mạng.
            - **Không mất chữ khi sửa ở hai nơi:** nếu cùng một ghi chú bị sửa trên hai máy, phần bạn sửa được giữ thành ghi chú mới có tiêu đề `[Xung đột]` để gộp lại, không bao giờ bị ghi đè.
            - **Thùng rác 60 ngày:** xóa ghi chú giờ là chuyển vào thùng rác (menu ba chấm → Thùng rác), có thể khôi phục hoặc xóa vĩnh viễn.
            - **Biểu tượng trạng thái đồng bộ** ở thanh tiêu đề: đã đồng bộ, đang đồng bộ, ngoại tuyến hoặc lỗi.
            - **Lưu trữ an toàn hơn:** dữ liệu chuyển sang cơ sở dữ liệu SQLite, ghi theo giao dịch; có bản sao lưu tự động trước các thao tác có thể làm mất nội dung.

            ### ⚠️ Lưu ý khi nâng cấp:
            - **Hãy cập nhật tất cả thiết bị** lên bản này. Các bản cũ (1.4.x trở xuống) không còn đồng bộ được với bản mới.
            - Lần mở đầu tiên, ứng dụng tự chuyển ghi chú sang định dạng mới. **Dữ liệu cũ không bị xóa** và vẫn nằm trong `%APPDATA%\NoteCheatsheet`; nên sao chép thư mục này để dự phòng trước khi cập nhật.
            - Lần đăng nhập đầu tiên sẽ tải các ghi chú trên máy lên tài khoản (không ghi đè ghi chú nào đã có).

            ---
            ### 📦 Hướng dẫn cài đặt:
            - **File Cài đặt (`KQNoteSetup-*.exe`):** Tải về và chạy file installer để tự động cài đặt ứng dụng vào hệ thống.
            - **File Portable (`KQNote-*-Portable.zip`):** Giải nén và chạy trực tiếp `KQNote.exe` không cần cài đặt.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
