name: Build and Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # No google-auth* / OAuth client secret here: the desktop client only
          # opens the browser + catches the loopback code; the backend does the
          # code->token exchange. Nothing secret is bundled into the release.
          pip install nuitka zstandard ordered-set pillow pywin32 requests pynput
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }

      - name: Pre-process XOR Obfuscation
        run: |
          python xor_obfuscate.py

      - name: Build executable with Nuitka
        run: |
          python -m nuitka `
            --standalone `
            --assume-yes-for-downloads `
            --enable-plugin=tk-inter `
            --windows-console-mode=disable `
            --windows-icon-from-ico=assets/logo-kqnote.ico `
            --include-data-dir=assets=assets `
            --company-name="KQ Note" `
            --product-name="KQ Note" `
            --file-version=1.5.0.0 `
            --product-version=1.5.0.0 `
            --file-description="KQ Note - Desktop Cheatsheet Note App" `
            --copyright="Copyright (c) 2026 ckq7703" `
            --output-dir=dist `
            --output-filename=KQNote.exe `
            main.py
          if (Test-Path "dist\KQNote") { Remove-Item -Recurse -Force "dist\KQNote" }
          if (Test-Path "dist\main.dist") { Move-Item -Path "dist\main.dist" -Destination "dist\KQNote" -Force }

      - name: Compile Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Create Portable Zip
        run: |
          Compress-Archive -Path "dist\KQNote\*" -DestinationPath "installer_output\KQNote-Portable.zip" -Force

      - name: Extract Tag or Version Name
        id: version
        shell: powershell
        run: |
          $ver = "${{ github.ref_name }}"
          if ($ver -notlike "v*") { $ver = "v1.5.0" }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "TAG=$ver"

      - name: Rename Artifacts with Version
        shell: powershell
        run: |
          $ver = "${{ steps.version.outputs.TAG }}"
          Move-Item -Path "installer_output\KQNoteSetup.exe" -Destination "installer_output\KQNoteSetup-$ver.exe" -Force
          Move-Item -Path "installer_output\KQNote-Portable.zip" -Destination "installer_output\KQNote-$ver-Portable.zip" -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.version.outputs.TAG }}
          tag_name: ${{ steps.version.outputs.TAG }}
          draft: false
          prerelease: false
          files: |
            installer_output/KQNoteSetup-*.exe
            installer_output/KQNote-*-Portable.zip
          body: |
            ## KQ Note ${{ steps.version.outputs.TAG }}

            Multi-note cloud sync, a safer local storage engine, and a trash with restore.

            ### What's new

            - **Sync for every note.** Each note syncs individually between your devices, including its order and its trash state. Work offline; changes are kept on the device and sent automatically when the connection returns.
            - **No overwritten work.** If the same note is edited on two devices, edits in different places are merged line by line. If the edits collide, your version is kept as a new note titled `[Xung đột]` ("conflict") so that no text is lost.
            - **Trash with 60-day retention.** Deleting a note moves it to the trash (three-dot menu, Trash). Restore it, delete it permanently, or empty the trash. Permanent deletion also removes the note from the server.
            - **Sync status at a glance.** A cloud icon in the title bar shows whether sync is up to date, running, offline, or has an error, and the menu shows the details.
            - **Safer storage.** Notes now live in a local SQLite database with transactional writes. Your previous notes are converted automatically on first launch and the old files are left untouched.

            ### Upgrade notes

            - **Update every device you sync.** Versions before 1.5 use an older single-note sync protocol and cannot sync with 1.5.
            - On first launch your existing notes are converted. Nothing is deleted: the old files stay in `%APPDATA%\NoteCheatsheet`. Copying that folder before upgrading is recommended.
            - The first time you sign in, the notes on the device are uploaded to your account as new notes. Nothing already in the account is overwritten, and identical notes are not duplicated.
            - Server operators: the sync API gains request rate limiting, an optional minimum client version, and retirement of the old single-note endpoint. See the README for the new settings.

            ### Installation

            - **`KQNoteSetup-${{ steps.version.outputs.TAG }}.exe`**: installer. Per-user install, no administrator rights required.
            - **`KQNote-${{ steps.version.outputs.TAG }}-Portable.zip`**: extract and run `KQNote.exe`, no installation needed.

            Requires Windows 10 or Windows 11 (64-bit).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
